<!doctype html>
<html lang="pt-BR">

<style>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
const W = 1080, H = 1920, DUR = /*DUR*/60;
window.DEMO = { width: W, height: H, fps: 30, duration: DUR, motionBlur: { samples: 1, shutter: 0.5 } };
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const G = '/biblioteca/_/';
const TX = '/biblioteca/texturas/';
const IMG = {};
const srcs = { kraft: G + 'page_kraft_v.jpg', red: G + 'page_red_v.jpg', cream: G + 'page_cream_v.jpg', green: G + 'page_green_v.jpg',
  newsA: G + 'news_a.png', newsB: G + 'news_b.png', hand: G + 'manicule.png', washi: TX + 'washi/washi_solid_12.png',
  nface: G + 'neto_face.png', njaw: G + 'neto_jaw.png', board: G + 'board.png' };
const PECAS = /*PECAS*/{};
for (const [k, f] of Object.entries(PECAS)) srcs[k] = G + f + '.png';
delete srcs.board;
await Promise.all(Object.entries(srcs).map(([k, s]) => new Promise((res, rej) => { const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.onerror = () => rej(new Error('img ' + s)); im.src = s; })));
const LG = await (await fetch(G + 'layout.json')).json();
const LAY = LG, LG3 = LG;
const WORDS = await (await fetch('words.json')).json();
const ENV = await (await fetch('env.json')).json();
for (const f of ['80px Anton', '80px Alfa', '40px Elite', '30px Plex']) await document.fonts.load(f, 'ÁÉÍÓÚÂÊÔÃÕÇáéíóúâêôãõçÀà?!×·0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz');
await document.fonts.ready;

// ------------------------------------------------------------------ helpers
const STEP = 1 / 12;
const q12 = t => Math.floor(t * 12 + 1e-6) / 12;
function hash(n) { n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16; return (n >>> 0) / 4294967296; }
const hs = (s) => { let h = 2166136261; for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };
const rr = (seed, a, b) => a + (b - a) * hash(seed);
const D2R = Math.PI / 180;
const INK = '#1c1814', RED = '#c9261c', CREAM = '#f3ecdc', NEWS = '#e9e2cf', GOLD = '#e8b23a';

function jitter(id, t) { const k = Math.floor(t * 6); const s = hs(id) + k * 7919; return [rr(s, -2, 2), rr(s + 1, -2, 2), rr(s + 2, -0.6, 0.6)]; }
// slap entrance: steps since in
function slapK(t, t0) { return Math.floor((t - t0) * 12 + 1e-6); }
const SLAP_S = [1.32, 0.93, 1.03, 1.0], SLAP_R = [7, -2.5, 0.8, 0];

function shadowOn(b = 14, o = 7, a = 0.38) { ctx.shadowColor = `rgba(20,12,4,${a})`; ctx.shadowBlur = b; ctx.shadowOffsetX = o * 0.6; ctx.shadowOffsetY = o; }
function shadowOff() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; }

// transform for an element at time t (handles in/out/anim/jitter). returns null if not visible
function place(e, t) {
  if (t < e.in - 1e-6) return null;
  if (e.out !== undefined && t >= e.out + (e.exit === 'slide' ? 4 * STEP : 0)) return null;
  let x = e.x, y = e.y, s = e.s ?? 1, r = e.r ?? 0, alpha = 1, sh = 1;
  const k = slapK(t, e.in);
  const anim = e.anim || 'slap';
  if (anim === 'slap' && k < 4) { s *= SLAP_S[k]; r += SLAP_R[k] * (hash(hs(e.id)) > 0.5 ? 1 : -1); sh = k === 0 ? 2.2 : 1; }
  if (anim === 'drop' && k < 4) { y -= [260, 60, -12, 0][k]; r += [-8, 3, -1, 0][k]; sh = [2.5, 1.5, 1, 1][k]; }
  if (anim === 'slideL' && k < 4) { x -= [900, 380, 40, 0][k]; r += [-6, -3, 1, 0][k]; }
  if (anim === 'slideR' && k < 4) { x += [900, 380, 40, 0][k]; r += [6, 3, -1, 0][k]; }
  if (anim === 'grow' && k < 4) { s *= [0.2, 0.7, 1.08, 1][k]; }
  if (e.out !== undefined && t >= e.out) {
    const ko = slapK(t, e.out);
    const dir = e.exitDir ?? -1;
    x += dir * [140, 420, 820, 1400][Math.min(3, ko)]; r += dir * [4, 10, 16, 22][Math.min(3, ko)];
  }
  if (!e.still) { const j = jitter(e.id, t); x += j[0]; y += j[1]; r += j[2]; }
  return { x, y, s, r: r * D2R, sh };
}

function drawImgC(im, w, h) { ctx.drawImage(im, -w / 2, -h / 2, w, h); }

// torn paper polygon (rect with jagged edges), deterministic
function tornRect(w, h, seed, amp = 5, step = 14) {
  const pts = [];
  const edge = (x0, y0, x1, y1, si) => {
    const L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(2, Math.round(L / step));
    for (let i = 0; i < n; i++) {
      const u = i / n, nx = -(y1 - y0) / L, ny = (x1 - x0) / L, a = rr(seed + si * 1000 + i, -amp, amp);
      pts.push([x0 + (x1 - x0) * u + nx * a, y0 + (y1 - y0) * u + ny * a]);
    }
  };
  edge(-w / 2, -h / 2, w / 2, -h / 2, 1); edge(w / 2, -h / 2, w / 2, h / 2, 2); edge(w / 2, h / 2, -w / 2, h / 2, 3); edge(-w / 2, h / 2, -w / 2, -h / 2, 4);
  return pts;
}
function polyPath(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }

// halftone dot fill inside current path (subtle newsprint texture on flat paper)
let DOTP = null;
function dotPattern(col) {
  const c = document.createElement('canvas'); c.width = c.height = 9; const g = c.getContext('2d');
  g.fillStyle = col; g.beginPath(); g.arc(4.5, 4.5, 1.6, 0, Math.PI * 2); g.fill();
  return ctx.createPattern(c, 'repeat');
}
const PAT = { ink: dotPattern('rgba(0,0,0,0.035)'), red: dotPattern('rgba(120,0,0,0.07)'), cream: dotPattern('rgba(255,255,255,0.05)') };

function paperScrap(w, h, seed, fill, pat = 'ink', amp = 4) {
  const pts = tornRect(w, h, seed, amp);
  polyPath(pts); ctx.fillStyle = fill; ctx.fill();
  shadowOff();
  ctx.save(); polyPath(pts); ctx.clip(); ctx.fillStyle = PAT[pat]; ctx.fillRect(-w, -h, w * 2, h * 2); ctx.restore();
}
function tape(x, y, w, ang, seed) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.globalAlpha = 0.78; shadowOff();
  const pts = tornRect(w, 34, seed, 2.5, 8); polyPath(pts); ctx.fillStyle = 'rgba(236,226,196,0.9)'; ctx.fill();
  ctx.globalAlpha = 0.35; ctx.drawImage(IMG.washi, -w / 2, -17, w, 34);
  ctx.restore();
}

// ------------------------------------------------------------------ element renderers
function rImg(e, P) {
  const im = IMG[e.img]; const w = im.width * P.s, h = im.height * P.s;
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r);
  if (e.flip) ctx.scale(-1, 1);
  if (e.filter) ctx.filter = e.filter;
  shadowOn(12 * P.sh, 7 * P.sh); drawImgC(im, w, h); ctx.filter = 'none'; shadowOff(); ctx.restore();
  if (e.tape) for (const [tx, ty, tw, ta] of e.tape) tape(P.x + tx, P.y + ty, tw, ta * D2R + P.r, hs(e.id) + tx);
}

const FONTS = ['Anton', 'Alfa', 'Elite', 'Anton', 'Plex'];
function rRansom(e, P, t) {
  // each letter on its own scrap; letters appear one per 12-fps step
  const lines = e.text.split('\n');
  const size = e.size * P.s;
  const k = e.per === 'letter' ? slapK(t, e.in) : 999;
  let idx = 0;
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r);
  const lh = size * 1.18;
  lines.forEach((ln, li) => {
    // measure
    const chars = [...ln];
    const specs = chars.map((ch, ci) => {
      const sd = hs(e.id) + li * 131 + ci * 17;
      const f = ch === ' ' ? null : FONTS[Math.floor(hash(sd) * (e.fonts || 3))];
      const sz = size * rr(sd + 3, 0.86, 1.1);
      ctx.font = `${sz}px ${f || 'Anton'}`;
      const wch = ch === ' ' ? size * 0.32 : ctx.measureText(ch).width + size * 0.22;
      return { ch, sd, f, sz, wch };
    });
    const tot = specs.reduce((a, b) => a + b.wch, 0);
    let x = -tot / 2; const y = (li - (lines.length - 1) / 2) * lh;
    for (const sp of specs) {
      if (sp.ch !== ' ') {
        if (idx <= k) {
          const sd = sp.sd, pal = e.pal || ['cream', 'ink', 'red', 'news'];
          const bgk = pal[Math.floor(hash(sd + 9) * pal.length)];
          const bg = { cream: CREAM, ink: INK, red: RED, news: NEWS, gold: GOLD }[bgk];
          const fg = (bgk === 'ink' || bgk === 'red') ? CREAM : (hash(sd + 11) > 0.6 ? RED : INK);
          const lk = idx === k ? 0 : 3;
          const sc = [1.4, 0.92, 1.04, 1][Math.min(3, k - idx)] || 1;
          ctx.save(); ctx.translate(x + sp.wch / 2, y + rr(sd + 5, -size * 0.06, size * 0.06)); ctx.rotate(rr(sd + 7, -7, 7) * D2R); ctx.scale(sc, sc);
          shadowOn(8, 5); const acc = /[ÁÉÍÓÚÂÊÔÃÕÀ]/.test(sp.ch); if (acc) ctx.translate(0, -sp.sz * 0.14); paperScrap(sp.wch * 0.98, sp.sz * (acc ? 1.42 : 1.12), sd, bg, bgk === 'red' ? 'red' : 'ink', 3); if (acc) ctx.translate(0, sp.sz * 0.14);
          ctx.font = `${sp.sz}px ${sp.f}`; ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(sp.ch, 0, sp.sz * 0.04);
          ctx.restore();
        }
        idx++;
      }
      x += sp.wch;
    }
  });
  ctx.restore();
}

function rTag(e, P, t) {
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r);
  const size = e.size || 54;
  ctx.font = `${size}px ${e.font || 'Anton'}`;
  const tw = ctx.measureText(e.text).width; const w = tw + size * 0.9, h = size * 1.45;
  shadowOn(10 * P.sh, 6 * P.sh);
  paperScrap(w * P.s, h * P.s, hs(e.id), e.bg || CREAM, e.bg === RED || e.bg === INK ? 'red' : 'ink', 4);
  ctx.scale(P.s, P.s);
  ctx.fillStyle = e.fg || INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e.text, 0, size * 0.05);
  if (e.strike !== undefined && t >= e.strike) { const u = Math.min(1, (slapK(t, e.strike) + 1) / 3); ctx.strokeStyle = RED; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-tw / 2 - 20, 6); ctx.lineTo(-tw / 2 - 20 + (tw + 40) * u, -4); ctx.stroke(); }
  ctx.restore();
  if (e.tapeOn !== false) tape(P.x - w * 0.42 * P.s, P.y - h * 0.42 * P.s, 90, -38 * D2R, hs(e.id) + 5);
}

function rStamp(e, P) {
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r); ctx.scale(P.s, P.s);
  const R = e.R || 120; shadowOff();
  if (e.fill) { shadowOn(12, 7); ctx.fillStyle = e.fill; ctx.beginPath(); for (let i = 0; i < 40; i++) { const a = i / 40 * 6.283, rad = R + 22 + rr(hs(e.id) + i, -6, 6); ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); } ctx.closePath(); ctx.fill(); shadowOff(); }
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = e.col || RED; ctx.fillStyle = e.col || RED;
  ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, R - 18, 0, Math.PI * 2); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const [a, b] = e.text.split('\n');
  ctx.font = `${R * 0.62}px Anton`; ctx.fillText(a, 0, b ? -R * 0.14 : 0);
  if (b) { ctx.font = `${R * 0.26}px Plex`; ctx.fillText(b, 0, R * 0.42); }
  // worn ink: knock out speckles
  ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1;
  for (let i = 0; i < 70; i++) { const s = hs(e.id) + i; ctx.beginPath(); ctx.arc(rr(s, -R, R), rr(s + 1, -R, R), rr(s + 2, 1, 4.5), 0, 7); ctx.fill(); }
  ctx.restore();
}

function rBubble(e, P) {
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r); ctx.scale(P.s, P.s);
  const lines = e.text.split('\n'); const size = e.size || 64;
  ctx.font = `${size}px ${e.font || 'Anton'}`;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + size * 1.1, h = lines.length * size * 1.15 + size * 0.9;
  shadowOn(12, 7);
  // tail
  ctx.beginPath(); const tx = e.tail || -1; ctx.moveTo(tx * w * 0.18, h / 2 - 6); ctx.lineTo(tx * w * 0.42, h / 2 + 70); ctx.lineTo(tx * w * 0.02, h / 2 - 6); ctx.closePath(); ctx.fillStyle = e.bg || CREAM; ctx.fill();
  paperScrap(w, h, hs(e.id), e.bg || CREAM, 'ink', 5);
  ctx.fillStyle = e.fg || INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => { ctx.fillStyle = (e.redLine === i) ? RED : (e.fg || INK); ctx.fillText(l, 0, (i - (lines.length - 1) / 2) * size * 1.15 + size * 0.04); });
  ctx.restore();
}

function rCircle(e, P, t) {   // hand-drawn red marker loop, drawn on over 4 steps
  const k = Math.min(4, slapK(t, e.in) + 1);
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r); shadowOff();
  ctx.strokeStyle = RED; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.globalAlpha = 0.92;
  ctx.beginPath();
  const n = 90, end = Math.floor(n * 1.12 * k / 4);
  for (let i = 0; i <= end; i++) {
    const a = i / n * Math.PI * 2 - 1.2, wob = 1 + 0.05 * Math.sin(i * 0.37 + hs(e.id)) + 0.03 * i / n;
    const x = Math.cos(a) * e.rx * wob, y = Math.sin(a) * e.ry * wob;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke(); ctx.restore();
}

function rHand(e, P) {   // manicule pointing; drawn mirrored to point left when e.flip
  const im = IMG.hand; const w = im.width * P.s, h = im.height * P.s;
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r); if (e.flip) ctx.scale(-1, 1);
  shadowOn(14 * P.sh, 9 * P.sh); drawImgC(im, w, h); shadowOff(); ctx.restore();
}

function talk(t, wins) { // jaw open 0..1 from narration envelope inside windows
  for (const [a, b] of wins) if (t >= a && t < b) { const i = Math.floor(t * 12); return Math.min(1, (ENV[i] || 0) * 1.25); }
  return 0;
}
function rLurdes(e, P, t) {
  const who = e.who || 'l';
  const f = IMG[who + 'face'], j = IMG[who + 'jaw'], s = P.s; const hj = (who === 'l' ? LG.lurdes_face : who === 'n' ? LG.neto_face : LG3[who + '_face']).jaw_hinge;
  const open = q12(t) === q12(t) ? talk(t, e.talk || []) : 0;
  const lev = open > 0.55 ? 2 : open > 0.2 ? 1 : 0;   // 3 replacement positions
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r); ctx.scale(s, s);
  shadowOn(14 * P.sh, 8 * P.sh);
  ctx.drawImage(f, -f.width / 2, -f.height / 2);
  shadowOff();
  const ox = -f.width / 2, oy = -f.height / 2;
  ctx.save(); ctx.translate(ox + hj[0], oy + hj[1] - 4); ctx.translate(0, [0, 10, 22][lev]); ctx.rotate([0, 1.5, 3][lev] * D2R);
  shadowOn(6, 3, 0.3); ctx.drawImage(j, -hj[0], -hj[1] + 4); shadowOff(); ctx.restore();
  ctx.restore();
}

function rSci(e, P, t) {
  const L = LAY.portrait, s = P.s;
  const f = IMG.pface, j = IMG.pjaw, l = IMG.plid;
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r); ctx.scale(s, s);
  const ox = -f.width / 2, oy = -f.height / 2;
  // lid opening
  let ang = 0;
  if (t >= e.lid) { const k = slapK(t, e.lid); ang = [-28, -78, -112, -104, -108][Math.min(4, k)]; }
  // space behind the open head
  if (ang !== 0) {
    ctx.save(); ctx.translate(ox, oy);
    ctx.beginPath(); ctx.moveTo(L.cut[0][0], L.cut[0][1]); for (const p of L.cut) ctx.lineTo(p[0], p[1]);
    ctx.lineTo(L.cut[L.cut.length - 1][0], -400); ctx.lineTo(L.cut[0][0], -400); ctx.closePath(); ctx.clip();
    ctx.drawImage(IMG.space, -300, -560, 1400, 452 * 1400 / 1920 * 2.2);
    ctx.restore();
  }
  shadowOn(16 * P.sh, 9 * P.sh); ctx.drawImage(f, ox, oy); shadowOff();
  const open = talk(t, e.talk || []); const lev = open > 0.55 ? 2 : open > 0.2 ? 1 : 0;
  ctx.save(); ctx.translate(ox + L.jaw_hinge[0], oy + L.jaw_hinge[1]); ctx.translate(0, [0, 9, 20][lev]);
  shadowOn(5, 3, 0.3); ctx.drawImage(j, -L.jaw_hinge[0], -L.jaw_hinge[1]); shadowOff(); ctx.restore();
  ctx.save(); ctx.translate(ox + L.hinge[0], oy + L.hinge[1]); ctx.rotate(ang * D2R);
  shadowOn(14, 8); ctx.drawImage(l, -L.hinge[0], -L.hinge[1]); shadowOff(); ctx.restore();
  ctx.restore();
}

function rBoard(e, P, t) {
  rImg({ ...e, img: 'board' }, P);
  const k = Math.max(0, slapK(t, e.in) - 2);
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r); ctx.scale(P.s, P.s);
  ctx.strokeStyle = 'rgba(240,236,220,0.92)'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  const pts = e.line; const n = Math.min(pts.length, 2 + Math.floor(k * 1.5));
  pts.slice(0, n).forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  ctx.font = '44px Elite'; ctx.fillStyle = 'rgba(240,236,220,0.95)'; ctx.textAlign = 'center'; ctx.fillText(e.label, 0, -88);
  ctx.restore();
}

function rPack(e, P) {
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r); ctx.scale(P.s, P.s);
  shadowOn(12, 7);
  ctx.beginPath(); ctx.moveTo(-100, -150); ctx.lineTo(100, -150); ctx.lineTo(112, 150); ctx.lineTo(-112, 150); ctx.closePath();
  ctx.fillStyle = '#7a4a26'; ctx.fill(); shadowOff();
  ctx.fillStyle = PAT.ink; ctx.fill();
  ctx.fillStyle = RED; ctx.fillRect(-106, -40, 212, 70);
  ctx.fillStyle = CREAM; ctx.font = '58px Anton'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('CAFÉ', 0, -4);
  ctx.font = '22px Plex'; ctx.fillText('TORRADO E MOÍDO', 0, 70); ctx.fillText('500 g', 0, 110);
  ctx.strokeStyle = CREAM; ctx.lineWidth = 6; ctx.strokeRect(-100, -150, 200, 300); ctx.restore();
  // white scissor rim feel
}

function rCherry(e, P) {
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r); ctx.scale(P.s, P.s);
  shadowOn(8, 5); ctx.fillStyle = CREAM; ctx.beginPath(); ctx.ellipse(0, 0, 40, 44, 0, 0, 7); ctx.fill(); shadowOff();
  ctx.fillStyle = e.col || '#c41e22'; ctx.beginPath(); ctx.ellipse(0, 0, 33, 37, 0, 0, 7); ctx.fill();
  ctx.fillStyle = PAT.red; ctx.fill();
  ctx.fillStyle = 'rgba(255,170,150,0.8)'; ctx.beginPath(); ctx.ellipse(-11, -14, 9, 7, -0.5, 0, 7); ctx.fill();
  if (e.label) { ctx.font = '26px Plex'; ctx.fillStyle = CREAM; ctx.textAlign = 'center'; ctx.fillText(e.label, 0, 74); }
  ctx.restore();
}

function rStrip(e, P) {  // torn newspaper strip with headline line
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.r); ctx.scale(P.s, P.s);
  shadowOn(12, 7); paperScrap(e.w, e.h, hs(e.id), e.bg || NEWS, 'ink', 6);
  ctx.fillStyle = e.fg || INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${e.size || 70}px ${e.font || 'Alfa'}`; ctx.fillText(e.text, 0, 4);
  ctx.restore();

function rBtn(e, P) {

const R = { mimg: rMimg, chart: rChart, route: rRoute, arrow: rArrow, btn: rBtn, heart: rHeart, img: rImg, ransom: rRansom, tag: rTag, stamp: rStamp, bubble: rBubble, circle: rCircle, hand: rHand, lurdes: rLurdes, sci: rSci, board: rBoard, pack: rPack, cherry: rCherry, strip: rStrip };

// ------------------------------------------------------------------ scenes
let uid = 0;
const E = (o) => ({ id: 'e' + (uid++), ...o });
const SC = [];
function scene(page, t0, t1, els, opt = {}) { SC.push({ page, t0, t1, els, ...opt }); }

const CAPA = location.search.includes('capa');
/*CENAS*/
if (CAPA && typeof CAPA_SCENE === 'function') { SC.length = 0; CAPA_SCENE(); }

// draw order: as listed
const FLIP = 4 * STEP;

function drawPage(name, t) {
  shadowOff();
  if (name === 'split') {
    ctx.drawImage(IMG.cream, 0, 0, W, H);
    ctx.save(); const pts = [[560, -10]]; for (let i = 0; i <= 64; i++) pts.push([540 + rr(4400 + i, -14, 14), i * 30]); pts.push([560, H + 10], [W + 10, H + 10], [W + 10, -10]);
    polyPath(pts); ctx.clip(); ctx.drawImage(IMG.green, 0, 0, W, H); ctx.restore();
    ctx.save(); ctx.strokeStyle = 'rgba(246,240,226,0.95)'; ctx.lineWidth = 7; ctx.beginPath(); for (let i = 0; i <= 64; i++) { const x = 540 + rr(4400 + i, -14, 14), y = i * 30; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.restore();

const ease = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

// ------------------------------------------------------------------ captions
const KEY = new Set(/*KEY*/[]);
const norm = w => w.toLowerCase().replace(/[^a-zà-ú0-9]/g, '');
const GROUPS = [];
{
  let cur = [];

    const w = WORDS[i]; cur.push(w);
